<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>親子ゲーム 持ち帰りカード（8面付け）</title>
<style>
  @page { size:A4 portrait; margin:0 }
  *{ box-sizing:border-box; margin:0; padding:0 }
  :root{ --ink:#16262E; --muted:#6B7F88; --paper:#EAF2F5; --sea:#1B4965; --sky:#62B6CB; --vermilion:#E0452F; --gold:#E9B44C }
  html,body{ width:210mm; height:297mm }
  body{ font-family:"Noto Sans CJK JP",sans-serif; color:var(--ink); background:#fff;
        -webkit-print-color-adjust:exact; print-color-adjust:exact }
  .page{ width:210mm; height:297mm; padding:38.5mm 14mm; overflow:hidden }
  .sheet{ display:grid; grid-template-columns:repeat(2,91mm); grid-template-rows:repeat(4,55mm); gap:0 }
  .card{
    width:91mm; height:55mm; border:.2mm dashed #B9C8D0;
    padding:4mm 4mm 3mm; display:flex; align-items:center; gap:4mm;
  }
  .card .qr{ width:36mm; height:36mm; flex:none }
  .card .qr svg{ width:100%; height:100%; display:block }
  .tx{ flex:1; min-width:0 }
  .tx .t{ font-size:12.5pt; font-weight:900; color:var(--sea); line-height:1.3 }
  .tx .t em{ font-style:normal; color:var(--vermilion) }
  .tx .s{ margin-top:1.5mm; font-size:8pt; font-weight:700; color:var(--muted); line-height:1.5 }
  .tx .b{ margin-top:3mm; padding-top:2mm; border-top:.3mm solid var(--gold);
          font-size:9.5pt; font-weight:900; color:var(--sea) }
  .tx .b small{ display:block; font-size:7pt; font-weight:700; color:var(--muted); margin-top:.6mm }
</style></head>
<body><div class="page"><div class="sheet">
{CARDS}</div></div></body></html>
